command: record-mujoco
args:
  model: examples/mujoco_models/Microwave011.xml
  category: microwave
  object-id: microwave011
  output-dir: outputs/recordings
  duration-s: 4
  fps: 60
  control-mode: free
  joint-name: microjoint
  auto-initial-qvel-from-limits: true
  auto-initial-qvel-direction-mode: away-from-qpos0
  auto-initial-qvel-min-abs: 6.0
  auto-initial-qvel-max-abs: 8.0
  perturbation-scale: 0.0
  video: true
  camera-distance: 1.2
  camera-mode: triview
  camera-triview-spacing-deg: 90
  lookat: [0.0, 0.0, 0.0]
  disable-target-mesh-collision: true
  segmentation-masks: true
  part-segmentation-masks: true
