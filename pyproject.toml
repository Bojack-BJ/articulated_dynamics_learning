[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbd-urdf-mvp"
version = "0.1.0"
description = "RGB-D to canonical mesh, articulation, and URDF MVP scaffold."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
simulation = [
	"mujoco>=3.1.0",
	"numpy>=1.26",
]

viz = [
	"pillow>=10.0.0",
	"numpy>=1.26",
	"imageio>=2.34.0",
	"imageio-ffmpeg>=0.5.0",
]

tracking = [
	"torch>=2.1",
	"torchvision>=0.16",
	"pillow>=10.0.0",
	"numpy>=1.26",
]

mjx = [
	"jax>=0.4.30",
	"mujoco-mjx>=3.3.0",
]

remote-server = [
	"fastapi>=0.110",
	"uvicorn>=0.29",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
